# Pre-commit configuration: deterministic and CI-safe
# Note: pre-commit ignores anything already ignored by Git

repos:
  # Black formatter
  - repo: https://github.com/ambv/black
    rev: 26.1.0
    hooks:
      - id: black
        language_version: python3

  # Flake8 linter
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        language_version: python3
        additional_dependencies:
          - pep8-naming==0.12.1

  # Pre-commit hooks for general checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=55500"]
      - id: check-docstring-first
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key

  # isort for import sorting
  - repo: https://github.com/timothycrosley/isort
    rev: 7.0.0
    hooks:
      - id: isort
        language_version: python3

  # Docformatter for docstring formatting
  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.7
    hooks:
      - id: docformatter
        language_version: python3
        args:
          - --in-place
          - --wrap-summaries=88
          - --wrap-descriptions=88

  # Prettier for markdown, yaml, json, xml, toml
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json, xml, toml]

  # clang-format for C/C++ files
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        language_version: python3
        files: '\.(cpp|cxx|cc|hpp|hxx|hh)$'
        exclude: "third_party|generated"
